    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Theme init script to prevent flashing -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('webcubixs_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (prefersDark ? 'dark' : 'light');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-[#05070c] text-neutral-900 dark:text-neutral-100 antialiased selection:bg-cyan-500 selection:text-white transition-colors duration-300">

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
